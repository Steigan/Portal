<!doctype html>
<html>
  <head>
    <title>Второе окно</title>
    <!-- Подключаем тот же скрипт Google GSI -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      body {
        font-family: Arial;
        padding: 20px;
      }
      .loading {
        color: gray;
      }
      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>Второе окно</h1>
    <!-- <div id="status" class="loading">Ожидание авторизации...</div> -->
    <div id="loader">⏳ Загрузка данных из таблицы...</div>
    <div id="error" class="error"></div>

    <div id="appContent">
      <div class="section">
        <div id="infoText" class="section-text"></div>
        <div id="infoHTML"></div>
      </div>
    </div>

    <script>
      const errorDiv = document.getElementById("error");
      const loaderDiv = document.getElementById("loader");
      const infoText = document.getElementById("infoText");
      const infoHTML = document.getElementById("infoHTML");

      let currentIdToken = null;
      let email = null;

      async function load_settings() {
        const baseUrl =
          "https://script.google.com/macros/s/AKfycby06OccwIMKMK88Tdl6b56qW2i6k8hlo2qYtqLSfzWdZH6VpSxp9zo8o5gIa7NZult0tw/exec";
        //const baseUrl = 'https://script.google.com/macros/s/AKfycbxMFw3hO-qegx8A72lSMJuOyNlE4KQGkX62AWREnTY9T4-WC26bVJkLMI9HYZwFjXux/exec';

        if (!currentIdToken) {
          showError("Необходимо войти через Google.");
          return;
        }

        hideError();
        showLoader(true);
        this.disabled = true;

        try {
          // ВАЖНО: обычный form POST, чтобы не было CORS preflight
          const formData = new URLSearchParams();
          formData.append("idToken", currentIdToken);

          const resp = await fetch(baseUrl, {
            method: "POST",
            body: formData,
          });

          if (!resp.ok) throw new Error("HTTP " + resp.status);
          const json = await resp.json();

          if (!json.ok) {
            showError(
              json.forbidden
                ? "⛔ " + json.error + "\n\nОбратитесь к администратору."
                : json.error,
            );
            return;
          }
          const formatted = JSON.stringify(json.settings, null, 4);
          infoText.textContent = formatted;
          infoHTML.replaceChildren('<a href="#">Ссылка</a>');
        } catch (err) {
          showError("Ошибка загрузки: " + err.message);
        } finally {
          showLoader(false);
        }
      }

      // Сообщаем первому окну что готовы
      if (window.opener) {
        window.opener.postMessage("ready", window.location.origin);
      }

      // Принимаем токен
      window.addEventListener("message", function (event) {
        if (event.origin !== window.location.origin) return;
        if (event.data && event.data.type === "AUTHTOKEN") {
          currentIdToken = event.data.token;
          email = event.data.email;
          // Используем токен для авторизации в Google API
          //console.log("Авторизован:", email, currentIdToken);
          // Можно делать запросы к Google Apps Script с этим токеном
          load_settings();
        }
      });
      // ─── Утилиты ─────────────────────────────────────────────────────────────
      function showLoader(state) {
        loaderDiv.style.display = state ? "block" : "none";
      }
      function showError(msg) {
        errorDiv.textContent = msg;
        errorDiv.style.display = "block";
      }
      function hideError() {
        errorDiv.style.display = "none";
      }
    </script>
  </body>
</html>
