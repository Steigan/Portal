<!doctype html>
<html lang="ru">
  <head>

    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
      :root,
      [data-theme="light"] {
        --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
        --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
        --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
        --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
        --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.25rem;
        --space-6: 1.5rem;
        --space-8: 2rem;
        --space-10: 2.5rem;
        --space-12: 3rem;
        --space-16: 4rem;
        --color-bg: #f7f6f2;
        --color-surface: #f9f8f5;
        --color-surface-2: #fbfbf9;
        --color-surface-offset: #edeae5;
        --color-border: #d4d1ca;
        --color-divider: #dcd9d5;
        --color-text: #28251d;
        --color-text-muted: #7a7974;
        --color-text-inverse: #f9f8f4;
        --color-primary: #01696f;
        --color-primary-hover: #0c4e54;
        --color-primary-highlight: #cedcd8;
        --radius-sm: 0.375rem;
        --radius-md: 0.5rem;
        --radius-lg: 0.75rem;
        --radius-xl: 1rem;
        --radius-full: 1rem;
        --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
        --shadow-md: 0 4px 12px oklch(0.2 0.01 80 / 0.08);
        --transition-interactive: 180ms cubic-bezier(0.16, 1, 0.3, 1);
        --font-body: "Satoshi", "Inter", sans-serif;
        --font-display: "Satoshi", "Inter", sans-serif;
      }
      [data-theme="dark"] {
        --color-bg: #171614;
        --color-surface: #1c1b19;
        --color-surface-2: #201f1d;
        --color-surface-offset: #22211f;
        --color-border: #393836;
        --color-divider: #262523;
        --color-text: #cdccca;
        --color-text-muted: #797876;
        --color-text-inverse: #2b2a28;
        --color-primary: #4f98a3;
        --color-primary-hover: #227f8b;
        --color-primary-highlight: #313b3b;
        --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
        --shadow-md: 0 4px 12px oklch(0 0 0 / 0.3);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --color-bg: #171614;
          --color-surface: #1c1b19;
          --color-surface-2: #201f1d;
          --color-surface-offset: #22211f;
          --color-border: #393836;
          --color-divider: #262523;
          --color-text: #cdccca;
          --color-text-muted: #797876;
          --color-text-inverse: #2b2a28;
          --color-primary: #4f98a3;
          --color-primary-hover: #227f8b;
          --color-primary-highlight: #313b3b;
          --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
          --shadow-md: 0 4px 12px oklch(0 0 0 / 0.3);
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        -webkit-text-size-adjust: none;
        text-size-adjust: none;
        scroll-behavior: smooth;
      }
      body {
        min-height: 100dvh;
        line-height: 1.6;
        font-family: var(--font-body);
        font-size: var(--text-base);
        color: var(--color-text);
        background: linear-gradient(
          180deg,
          var(--color-bg),
          var(--color-surface)
        );
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: none;
        transition:
          color var(--transition-interactive),
          background var(--transition-interactive),
          border-color var(--transition-interactive),
          box-shadow var(--transition-interactive),
          transform var(--transition-interactive);
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      :focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 3px;
        border-radius: var(--radius-sm);
      }
      .page {
        width: min(1200px, calc(100% - 2 * var(--space-4)));
        margin: 0 auto;
        padding: var(--space-6) 0 var(--space-12);
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-4);
        margin-bottom: var(--space-8);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: var(--space-3);
        color: var(--color-text);
        text-decoration: none;
      }
      .brand-mark {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: var(--radius-lg);
        background: linear-gradient(
          135deg,
          var(--color-primary-highlight),
          var(--color-surface-offset)
        );
        display: grid;
        place-items: center;
        box-shadow: var(--shadow-sm);
        border: 1px solid oklch(from var(--color-text) l c h / 0.08);
      }
      .brand svg {
        width: 1.4rem;
        height: 1.4rem;
      }
      .brand-text {
        display: flex;
        flex-direction: column;
      }
      .brand-text strong {
        font-size: var(--text-sm);
        line-height: 1.2;
      }
      .brand-text span {
        font-size: var(--text-xs);
        color: var(--color-text-muted);
      }
      .theme-toggle {
        width: 2.75rem;
        height: 2.75rem;
        border-radius: var(--radius-full);
        border: 1px solid oklch(from var(--color-text) l c h / 0.12);
        background: var(--color-surface-2);
        display: grid;
        place-items: center;
        box-shadow: var(--shadow-sm);
      }
      .theme-toggle:hover {
        background: var(--color-surface-offset);
        transform: translateY(-1px);
      }
      .hero {
        display: grid;
        gap: var(--space-6);
        margin-bottom: var(--space-8);
      }
      .hero-card,
      .table-card {
        background: color-mix(in oklch, var(--color-surface) 88%, transparent);
        border: 1px solid oklch(from var(--color-text) l c h / 0.1);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-md);
        backdrop-filter: blur(8px);
      }
      .hero-card {
        padding: clamp(var(--space-5), 3vw, var(--space-8));
      }
      .controls {
        display: grid;
        gap: var(--space-4);
        align-items: start;
      }
      .upload-row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3);
        align-items: center;
      }
      .file-label {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: var(--space-3) var(--space-5);
        background: var(--color-primary);
        color: var(--color-text-inverse);
        border-radius: var(--radius-full);
        font-weight: 700;
        box-shadow: var(--shadow-sm);
      }
      .file-label:hover {
        background: var(--color-primary-hover);
        transform: translateY(-1px);
      }
      .file-input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      .filter-block {
        display: grid;
        gap: var(--space-2);
        max-width: 320px;
      }
      .filter-label {
        font-size: var(--text-sm);
        font-weight: 700;
        color: var(--color-text);
      }
      .filter-select {
        min-height: 44px;
        padding: var(--space-3) var(--space-4);
        border-radius: var(--radius-lg);
        border: 1px solid oklch(from var(--color-text) l c h / 0.12);
        background: var(--color-surface-2);
        box-shadow: var(--shadow-sm);
      }
      .filter-select:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }
      .status {
        padding-top: var(--space-3);
        min-height: 1.5em;
        font-size: var(--text-sm);
        color: var(--color-text-muted);
      }
      .status.error {
        color: #e74c3c;
      }
      .table-card {
        padding: var(--space-5);
        overflow: hidden;
      }
      .table-head {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: end;
        gap: var(--space-3);
        margin-bottom: var(--space-4);
      }
      .table-head h2 {
        font-size: var(--text-lg);
      }
      .table-meta {
        color: var(--color-text-muted);
        font-size: var(--text-sm);
      }
      .table-wrap {
        overflow: auto;
        border-radius: var(--radius-lg);
        border: 1px solid var(--color-divider);
        background: var(--color-surface-2);
        content-visibility: auto;
      }
      thead th {
        position: sticky;
        top: 0;
        background: color-mix(
          in oklch,
          var(--color-surface-offset) 92%,
          var(--color-surface-2)
        );
        z-index: 1;
        text-align: left;
        font-size: var(--text-sm);
        font-weight: 700;
        padding: var(--space-3) var(--space-4);
        border-bottom: 1px solid var(--color-border);
        white-space: nowrap;
      }
      tbody td {
        vertical-align: top;
        padding: var(--space-3) var(--space-4);
        border-bottom: 1px solid
          color-mix(in oklch, var(--color-divider) 70%, transparent);
        font-size: var(--text-sm);
      }
      tbody tr:hover {
        background: color-mix(
          in oklch,
          var(--color-primary-highlight) 28%,
          var(--color-surface-2)
        );
      }
      tbody tr.group-row:hover {
        background: color-mix(
          in oklch,
          var(--color-surface-offset) 70%,
          var(--color-surface-2)
        );
      }
      tbody tr.group-row td {
        background: color-mix(
          in oklch,
          var(--color-surface-offset) 70%,
          var(--color-surface-2)
        );
        font-weight: 700;
        border-top: 1px solid var(--color-border);
      }
      #results thead th:last-child,
      #results tbody td:last-child,
      #results tfoot td:last-child {
        text-align: right;
      }
      tfoot td {
        font-weight: 700;
        padding: var(--space-3) var(--space-4);
        border-top: 1px solid var(--color-border);
        background: color-mix(
          in oklch,
          var(--color-surface-offset) 60%,
          var(--color-surface-2)
        );
        font-size: var(--text-sm);
      }
      .empty {
        padding: var(--space-10) var(--space-4);
        text-align: center;
        color: var(--color-text-muted);
      }
      #empty {
        background: color-mix(in oklch, var(--color-surface) 88%, transparent);
        border: 1px dashed oklch(from var(--color-text) l c h / 0.18);
        border-radius: var(--radius-lg);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 var(--space-3);
        border-radius: var(--radius-full);
        background: var(--color-primary-highlight);
        color: var(--color-primary);
        font-size: var(--text-xs);
        font-weight: 700;
        max-width: 100%;
      }
      .hidden {
        display: none !important;
      }
      @media (max-width: 700px) {
        .page {
          width: min(100% - 2 * var(--space-3), 1200px);
          padding-top: var(--space-4);
        }
        .topbar {
          align-items: flex-start;
        }
        .table-card {
          padding: var(--space-4);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand" aria-label="Отчёт об операциях по картам, СБП и QR">
          <span class="brand-mark" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2" y="5" width="20" height="14" rx="2"></rect>
              <path d="M2 10h20"></path>
              <path d="M6 15h4"></path>
            </svg>
          </span>
          <span class="brand-text">
            <strong>Отчёт об операциях по картам, СБП и QR</strong>
            <span>Загрузите исходный XLSX файл с платёжными операциями</span>
          </span>
        </div>
        <button
          class="theme-toggle"
          type="button"
          data-theme-toggle
          aria-label="Переключить тему"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </header>

      <main>
        <section class="hero" aria-labelledby="page-title">
          <div class="hero-card">
            <div class="controls">
              <div class="upload-row">
                <label class="file-label" for="fileInput">Загрузить XLSX</label>
                <input
                  id="fileInput"
                  class="file-input"
                  type="file"
                  accept=".xlsx,.xls"
                />
                <span id="fileName" class="badge" aria-live="polite"
                  >Файл не выбран</span
                >
              </div>
              <div class="filter-block">
                <label class="filter-label" for="address"
                  >Адрес торговой точки (ТСТ)</label
                >
                <select id="address" class="filter-select" disabled>
                  <option value="__all__">Все адреса</option>
                </select>
              </div>
            </div>
            <p id="status" class="status">Выберите файл в формате XLSX.</p>
          </div>
        </section>

        <section
          id="results"
          class="results table-card hidden"
          aria-labelledby="results-title"
        >
          <div class="table-head">
            <div>
              <h2 id="results-title">Платежи</h2>
              <p class="table-meta" id="resultMeta">Пока данных нет.</p>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Дата поступления на р/с</th>
                  <th>Дата платежа</th>
                  <th>Сумма</th>
                </tr>
              </thead>
              <tbody id="body"></tbody>
              <tfoot>
                <tr>
                  <td colspan="2">Всего</td>
                  <td id="total"></td>
                </tr>
              </tfoot>
            </table>
          </div>
        </section>

        <div id="empty" class="empty">Данные пока не загружены.</div>
      </main>
    </div>

    <script>
      (function () {
        const themeToggle = document.querySelector("[data-theme-toggle]");
        const root = document.documentElement;
        let theme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        root.setAttribute("data-theme", theme);
        const setThemeIcon = () => {
          themeToggle.innerHTML =
            theme === "dark"
              ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
              : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
          themeToggle.setAttribute(
            "aria-label",
            "Переключить на " +
              (theme === "dark" ? "светлую" : "тёмную") +
              " тему",
          );
        };
        setThemeIcon();
        themeToggle.addEventListener("click", () => {
          theme = theme === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", theme);
          setThemeIcon();
        });
      })();

      (() => {
        const required = [
          "Адрес ТСТ",
          "Дата операции",
          "Дата ПП",
          "Сумма операции",
        ];
        const $ = (id) => document.getElementById(id);
        const state = { rows: [] };
        const norm = (v) =>
          String(v ?? "")
            .replace(/\u00a0/g, " ")
            .replace(/\s+/g, " ")
            .trim()
            .toLocaleLowerCase("ru");
        const keyName = (v) => norm(v).replace(/ё/g, "е");
        const formatDate = (value) => {
          if (value === null || value === undefined || value === "") return "";

          // Серийная дата Excel: извлекаем компоненты даты без часового пояса.
          if (typeof value === "number") {
            const p = XLSX.SSF.parse_date_code(value);
            if (p) {
              return (
                String(p.d).padStart(2, "0") +
                "." +
                String(p.m).padStart(2, "0") +
                "." +
                String(p.y)
              );
            }
          }

          const s = String(value).trim();

          // Для ISO-значений берём календарную часть напрямую:
          // «2026-08-07T00:00:00.000Z» → «07.08.2026».
          const iso = s.match(/^(\\d{4})-(\\d{2})-(\\d{2})/);
          if (iso) {
            return `${iso[3]}.${iso[2]}.${iso[1]}`;
          }

          // Для российских дат и дат со временем сохраняем часть даты.
          const ru = s.match(/^(\\d{1,2})[.\\/-](\\d{1,2})[.\\/-](\\d{2,4})/);
          if (ru) {
            const year = ru[3].length === 2 ? "20" + ru[3] : ru[3];
            return `${ru[1].padStart(2, "0")}.${ru[2].padStart(2, "0")}.${year}`;
          }

          return s;
        };
        const amount = (v) => {
          if (typeof v === "number") return v;
          let s = String(v ?? "")
            .replace(/\s|\u00a0/g, "")
            .replace(/[^0-9,.-]/g, "");
          if (s.includes(",") && s.includes("."))
            s = s.replace(/\./g, "").replace(",", ".");
          else s = s.replace(",", ".");
          const n = Number(s);
          return Number.isFinite(n) ? n : 0;
        };
        const money = new Intl.NumberFormat("ru-RU", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
        const fileInput = $("fileInput");
        const fileName = $("fileName");
        const resultMeta = $("resultMeta");
        function setStatus(text, error = false) {
          const e = $("status");
          e.textContent = text;
          e.className = "status" + (error ? " error" : "");
        }
        function findHeader(matrix) {
          const expected = required.map(keyName);
          for (let i = 0; i < Math.min(matrix.length, 50); i++) {
            const row = matrix[i].map(keyName);
            if (expected.every((x) => row.includes(x))) return i;
          }
          return -1;
        }
        function dateKey(s) {
          if (!s) return 0;
          const m = String(s).match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
          return m ? +m[3] * 10000 + +m[2] * 100 + +m[1] : 0;
        }
        function render() {
          const selected = $("address").value;
          const grouped = new Map();
          state.rows
            .filter((r) => selected === "__all__" || r.address === selected)
            .forEach((r) => {
              const k = r.payment + "\u0000" + r.receipt;
              const old = grouped.get(k);
              grouped.set(k, { ...r, sum: (old?.sum || 0) + r.sum });
            });
          const data = [...grouped.values()].sort(
            (a, b) =>
              dateKey(a.receipt) - dateKey(b.receipt) ||
              dateKey(a.payment) - dateKey(b.payment),
          );
          const html = [];
          let groupSum = 0;
          let currentReceipt = null;
          data.forEach((r) => {
            if (r.receipt !== currentReceipt) {
              if (currentReceipt !== null) {
                html.push(
                  `<tr class="group-row"><td>${escapeHtml(currentReceipt)} · Итого</td><td></td><td>${money.format(groupSum)}</td></tr>`,
                );
              }
              currentReceipt = r.receipt;
              groupSum = 0;
            }
            groupSum += r.sum;
            html.push(
              `<tr><td>${escapeHtml(r.receipt)}</td><td>${escapeHtml(r.payment)}</td><td>${money.format(r.sum)}</td></tr>`,
            );
          });
          if (currentReceipt !== null) {
            html.push(
              `<tr class="group-row"><td>${escapeHtml(currentReceipt)} · Итого</td><td></td><td>${money.format(groupSum)}</td></tr>`,
            );
          }
          $("body").innerHTML = html.join("");
          $("total").textContent = money.format(
            data.reduce((s, r) => s + r.sum, 0),
          );
          $("results").classList.toggle("hidden", !data.length);
          $("empty").classList.toggle("hidden", !!data.length);
          const groups = new Set(data.map((r) => r.receipt)).size;
          resultMeta.textContent = data.length
            ? `Показано строк: ${data.length} · Групп: ${groups}`
            : "По выбранному адресу платежей нет.";
          if (!data.length)
            $("empty").textContent = "По выбранному адресу платежи не найдены.";
        }
        function escapeHtml(s) {
          const x = document.createElement("span");
          x.textContent = s;
          return x.innerHTML;
        }
        fileInput.addEventListener("change", async (event) => {
          const [file] = event.target.files || [];
          if (!file) return;
          fileName.textContent = file.name;
          if (!window.XLSX)
            return setStatus(
              "Не удалось загрузить библиотеку Excel. Проверьте подключение к интернету и обновите страницу.",
              true,
            );
          setStatus("Чтение файла…");
          try {
            const buffer = await file.arrayBuffer();
            const wb = XLSX.read(buffer, {
              type: "array",
              cellDates: false,
            });
            let matrix = [];
            for (const name of wb.SheetNames) {
              const a = XLSX.utils.sheet_to_json(wb.Sheets[name], {
                header: 1,
                defval: "",
                raw: true,
              });
              if (findHeader(a) >= 0) {
                matrix = a;
                break;
              }
            }
            const h = findHeader(matrix);
            if (h < 0)
              throw new Error(
                "В файле не найдена строка с обязательными полями: " +
                  required.join(", ") +
                  ".",
              );
            const headers = matrix[h].map(keyName),
              ix = Object.fromEntries(
                required.map((n) => [n, headers.indexOf(keyName(n))]),
              );
            state.rows = matrix
              .slice(h + 1)
              .filter((r) => r.some((v) => v !== "" && v != null))
              .map((r) => ({
                address: String(r[ix["Адрес ТСТ"]] ?? "").trim(),
                payment: formatDate(r[ix["Дата операции"]]),
                receipt: formatDate(r[ix["Дата ПП"]]),
                sum: amount(r[ix["Сумма операции"]]),
              }))
              .filter((r) => r.address);
            const addresses = [
              ...new Set(state.rows.map((r) => r.address)),
            ].sort((a, b) => a.localeCompare(b, "ru"));
            $("address").innerHTML =
              '<option value="__all__">Все адреса</option>' +
              addresses
                .map(
                  (a) =>
                    `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`,
                )
                .join("");
            $("address").disabled = false;
            render();
            setStatus(
              `Загружено строк: ${state.rows.length}. Адресов ТСТ: ${addresses.length}.`,
            );
          } catch (err) {
            state.rows = [];
            $("address").disabled = true;
            render();
            $("empty").textContent = "Данные не загружены.";
            setStatus(err.message, true);
          }
        });
        $("address").addEventListener("change", render);
      })();
    </script>
  </body>
</html>
